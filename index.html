<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aster — ASCII &amp; Dither wallpaper generator</title>
    <meta
      name="description"
      content="ASCII &amp; Dither wallpaper generator. Turn any photo into a living ASCII wallpaper, pick a palette, and save a PNG."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aster — ASCII &amp; Dither wallpaper generator" />
    <meta
      property="og:description"
      content="ASCII &amp; Dither wallpaper generator. Turn any photo into a living ASCII wallpaper, pick a palette, and save a PNG."
    />
    <meta property="og:url" content="https://victoriawu-77.github.io/ascii-wallpaper/" />
    <meta property="og:image" content="https://victoriawu-77.github.io/ascii-wallpaper/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aster, an ASCII and Dither wallpaper generator. Turn any photo into a living ASCII wallpaper." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aster — ASCII &amp; Dither wallpaper generator" />
    <meta name="twitter:description" content="ASCII &amp; Dither wallpaper generator. Turn any photo into a living ASCII wallpaper." />
    <meta name="twitter:image" content="https://victoriawu-77.github.io/ascii-wallpaper/og.png" />
    <meta name="twitter:image:alt" content="Aster, an ASCII and Dither wallpaper generator. Turn any photo into a living ASCII wallpaper." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="frame">
    <div class="hero-bg" aria-hidden="true"></div>
    <header class="topbar">
        <a class="brand" href="./">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 2.5v19M4.2 7.2 19.8 16.8M19.8 7.2 4.2 16.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          Aster
        </a>
        <p class="brand-note">Wallpaper generator</p>
    </header>
    <main class="stage window">
      <div class="art is-pending" id="art">
        <img id="art-photo" class="art-photo" alt="" hidden />
        <video
          id="art-video"
          class="art-video"
          muted
          playsinline
          autoplay
          loop
          preload="auto"
          disablepictureinpicture
          aria-hidden="true"
          hidden
        ></video>
        <canvas id="effect-canvas" class="effect-canvas" aria-hidden="true"></canvas>
        <div class="veil" aria-hidden="true"></div>
        <p class="drawing">Drawing…</p>
        <div class="drop-hint">Drop an image or video</div>
      </div>
      <section class="chat" id="chat" aria-label="Wallpaper chat">
        <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-relevant="additions" hidden></div>
        <form id="chat-form" class="composer glass" autocomplete="off">
          <label class="visually-hidden" for="chat-input">Ask about the wallpaper</label>
          <input
            id="chat-input"
            name="message"
            type="text"
            maxlength="400"
            placeholder="Let the light settle on the wings…"
            autocomplete="off"
            enterkeyhint="send"
          />
          <button type="submit" class="send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 19V6M7 11l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </form>
    </section>
    </main>
    </div>
    <section class="dock" aria-label="Effect controls">
      <div id="effect-panel"></div>
    </section>
    <input id="wallpaper-file" type="file" accept="image/*,video/*" hidden />
    <noscript>
      <p class="noscript">JavaScript is required to draw the wallpaper.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
