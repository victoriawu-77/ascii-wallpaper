<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aster — wallpaper studio</title>
    <meta
      name="description"
      content="Aster redraws a looping wallpaper as ASCII or ordered dither. A chat in the center of the stage answers on this page."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,620&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="./">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 2.5v19M4.2 7.2 19.8 16.8M19.8 7.2 4.2 16.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        Aster
      </a>
      <p class="brand-note">Wallpaper studio</p>
      <button type="button" class="ghost" id="focus-toggle" aria-pressed="false">Focus</button>
    </header>
    <main class="stage">
      <div class="art" id="art">
        <img id="art-photo" class="art-photo" alt="" hidden />
        <video
          id="art-video"
          class="art-video"
          muted
          playsinline
          autoplay
          loop
          preload="auto"
          disablepictureinpicture
          aria-hidden="true"
          hidden
        ></video>
        <canvas id="effect-canvas" class="effect-canvas" aria-hidden="true"></canvas>
        <p class="caption">Keep this light.</p>
        <p class="wallpaper-name" id="wallpaper-name"></p>
        <div class="drop-hint">Drop an image or video</div>
        <button type="button" class="focus-exit" id="focus-exit">Close</button>
      </div>
      <section class="chat" id="chat" aria-labelledby="chat-name">
        <header class="chat-head">
          <span class="chat-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M12 3v18M4.5 7.4 19.5 16.6M19.5 7.4 4.5 16.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </span>
          <div>
            <h1 id="chat-name">Aster</h1>
            <p class="chat-prompt">Ask about the wallpaper on this page.</p>
          </div>
        </header>
        <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-relevant="additions">
          <p class="bubble bubble-bot">Hi. I am Aster. The butterfly loop is playing behind this chat.</p>
        </div>
        <div class="chat-chips" role="group" aria-label="Starter questions">
          <button type="button" data-starter="What is this look?">What is this look?</button>
          <button type="button" data-starter="How do I change it?">How do I change it?</button>
          <button type="button" data-starter="How do I save a frame?">How do I save a frame?</button>
        </div>
        <form id="chat-form" class="composer" autocomplete="off">
          <label class="visually-hidden" for="chat-input">Message Aster</label>
          <input
            id="chat-input"
            name="message"
            type="text"
            maxlength="400"
            placeholder="Message Aster"
            autocomplete="off"
            enterkeyhint="send"
          />
          <button type="submit" class="send">Send</button>
        </form>
      </section>
    </main>
    <section class="dock" aria-label="Effect controls">
      <div id="effect-panel"></div>
    </section>
    <input id="wallpaper-file" type="file" accept="image/*,video/*" hidden />
    <noscript>
      <p class="noscript">JavaScript is required to draw the wallpaper and the chat.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
